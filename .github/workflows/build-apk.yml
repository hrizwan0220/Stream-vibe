
name: Build Stream Vibe APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q stream-vibe-android-tv.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          ANDROID_DIR="$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          gradle -p "$ANDROID_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: stream-vibe-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
